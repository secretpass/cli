[workspace]
members = ["cargo:."]


[dist]
allow-dirty = ["ci"]
ci = "github"
tap = "secretpass/homebrew-tap"
install-updater = true
github-attestations = true
cargo-dist-version = "0.33.1"

plan-setup = "setup/build-setup.yaml"
github-build-setup = "setup/build-setup.yaml"
installers = ["shell", "homebrew"]
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
install-path = "CARGO_HOME"
publish-jobs = ["homebrew"]


[dist.bin-aliases]
spass = ["secretpass"]